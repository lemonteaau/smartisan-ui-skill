# Publishes assets/demo.html (the full kit replica + interaction board) to GitHub Pages.
name: Deploy demo to Pages

on:
  push:
    branches: [main]
    paths: ['assets/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p _site
          cp assets/demo.html _site/index.html
          cp assets/smartisan.css assets/smartisan.js _site/
          cp -R assets/brand _site/brand
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
